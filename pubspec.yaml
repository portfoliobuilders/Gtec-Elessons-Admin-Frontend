name: gtec_admin
description: G-TEC Education Admin Console — pixel-perfect Flutter recreation of the web design.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  http: ^1.2.2
  http_parser: ^4.1.2
  shared_preferences: ^2.3.2
  file_picker: 11.0.3
  excel: ^4.0.6
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/images/
